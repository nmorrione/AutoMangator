<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icona di AutoMangator: pagina di fumetto con vignette e nuvoletta.
       Sorgente di Assets/icon.ico (Windows) e Assets/AppIcon.icns (macOS). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E5245E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5A0A26" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="210" fill="url(#bg)"/>

  <!-- pagina -->
  <g filter="url(#shadow)">
    <rect x="232" y="170" width="520" height="690" rx="44" fill="#FFFFFF"/>
  </g>

  <!-- vignette -->
  <g fill="#1F2847">
    <rect x="282" y="222" width="420" height="230" rx="22"/>
    <rect x="282" y="490" width="195" height="318" rx="22"/>
    <rect x="507" y="490" width="195" height="318" rx="22"/>
  </g>

  <!-- nuvoletta -->
  <g filter="url(#shadow)">
    <path d="M 742 118
             C 868 118 952 186 952 278
             C 952 370 868 438 742 438
             C 716 438 692 435 670 429
             L 586 492 L 606 405
             C 560 377 532 332 532 278
             C 532 186 616 118 742 118 Z"
          fill="#FFFFFF" stroke="#1F2847" stroke-width="26" stroke-linejoin="round"/>
  </g>
  <g fill="#1F2847">
    <circle cx="664" cy="280" r="27"/>
    <circle cx="742" cy="280" r="27"/>
    <circle cx="820" cy="280" r="27"/>
  </g>
</svg>
